<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7c3aed">
    <title>Offline - 9Dot Campaign OS</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; color: #f8fafc; background: radial-gradient(circle at top right, #3b0764 0, #18181b 38%, #09090b 75%); }
        main { width: min(100%, 30rem); padding: 2rem; text-align: center; border: 1px solid rgba(168, 85, 247, .32); border-radius: 1.5rem; background: rgba(9, 9, 11, .82); box-shadow: 0 24px 80px rgba(0, 0, 0, .45); backdrop-filter: blur(18px); }
        img { width: 6rem; height: 6rem; object-fit: contain; }
        h1 { margin: 1rem 0 .5rem; font-size: 1.6rem; }
        p { margin: 0; color: #d4d4d8; line-height: 1.6; }
        button { margin-top: 1.5rem; padding: .8rem 1.2rem; border: 0; border-radius: .8rem; color: white; font: inherit; font-weight: 700; cursor: pointer; background: linear-gradient(135deg, #9333ea, #6d28d9 58%, #18181b); }
    </style>
</head>
<body>
    <main>
        <img src="/images/9dot-logo.png" alt="9Dot Campaign OS">
        <h1>You are currently offline</h1>
        <p>Campaign data is protected and is not stored in the offline cache. Reconnect to the internet and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
